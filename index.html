<script>window.BCDChapters=[{"id":"01-introduction","index":0,"title":"From four bits to one digit","chapter":"THE DESIGN CHALLENGE","takeaway":"Design the logic that turns a BCD input into a decimal digit.","start":0,"duration":23,"phraseStarts":[0.918416,13.401041]},{"id":"02-and","index":1,"title":"AND: both inputs must be 1","chapter":"01 / LOGIC GATES","takeaway":"AND recognizes a combination: every required condition must be true.","start":23,"duration":24,"phraseStarts":[0.90525,9.285583,13.679041]},{"id":"03-or","index":2,"title":"OR: at least one input is 1","chapter":"01 / LOGIC GATES","takeaway":"OR combines alternatives. Both inputs may be 1.","start":47,"duration":24,"phraseStarts":[0.90525,7.218166333333331,11.412666666666665,18.159791]},{"id":"04-not","index":3,"title":"NOT: reverse the signal","chapter":"01 / LOGIC GATES","takeaway":"A bar means NOT: 0 becomes 1, and 1 becomes 0.","start":71,"duration":18,"phraseStarts":[0.8921250000000001,7.302541,10.344540999999996]},{"id":"05-interface","index":4,"title":"Define the input and the outputs","chapter":"02 / THE DECODER","takeaway":"BCD is one decimal digit in four bits. Output 1 means segment ON.","start":89,"duration":27,"phraseStarts":[0.918416,7.513208333333333,14.542249666666663,20.452833]},{"id":"06-truth","index":5,"title":"Design one output: segment a","chapter":"02 / THE DECODER","takeaway":"Top segment a is OFF for 1 and 4, and ON for every other BCD digit.","start":116,"duration":27,"phraseStarts":[0.90525,10.774,16.366415999999997]},{"id":"07-map","index":6,"title":"Rearrange the truth table","chapter":"03 / KARNAUGH MAP","takeaway":"Gray-code order makes neighboring cells differ in exactly one bit.","start":143,"duration":29,"phraseStarts":[0.90525,8.657665999999999,15.831165999999996,22.780958]},{"id":"08-grouping","index":7,"title":"Group neighbors to simplify","chapter":"03 / KARNAUGH MAP","takeaway":"Use rectangular groups of 1, 2, 4, 8… cells. Never include a 0.","start":172,"duration":34,"phraseStarts":[0.918416,7.610999999999999,13.764124999999998,21.917207999999995,27.965041]},{"id":"09-derive","index":8,"title":"Keep only the bits that stay constant","chapter":"03 / KARNAUGH MAP","takeaway":"A changing input disappears from that group’s product term.","start":206,"duration":42.03333333333333,"phraseStarts":[0.918416,7.260866,15.800732999999997,20.972141000000004,27.919841,35.722833]},{"id":"10-gates","index":9,"title":"Turn the expression into a circuit","chapter":"04 / BUILD THE LOGIC","takeaway":"Sum of products: AND builds each condition; OR combines the conditions.","start":248.03333333333333,"duration":28,"phraseStarts":[0.90525,9.000332666666665,15.226999333333328,19.76945799999999]},{"id":"11-pla","index":10,"title":"Share the logic in a regular array","chapter":"04 / BUILD THE LOGIC","takeaway":"15 shared product terms → 7 segment functions. A dot means connected.","start":276.0333333333333,"duration":32,"phraseStarts":[0.90525,6.512041,13.974124999999999,19.81775,25.450833000000003]},{"id":"12-validity","index":11,"title":"Blank every invalid BCD input","chapter":"04 / BUILD THE LOGIC","takeaway":"Don’t-care simplification + explicit blanking = defined behavior for all 16 inputs.","start":308.0333333333333,"duration":28.033333333333335,"phraseStarts":[0.90525,9.134249666666665,17.784291333333336,21.736958]},{"id":"13-trace","index":12,"title":"Trace one input: 0101 → 5","chapter":"05 / SIMULATE","takeaway":"0101 enables a, c, d, f and g. The display shows 5.","start":336.06666666666666,"duration":30,"phraseStarts":[0.90525,5.456166,9.612333,16.636875,22.385165999999998]},{"id":"14-simulation","index":13,"title":"Exercise the complete decoder","chapter":"05 / SIMULATE","takeaway":"The same fixed circuit handles every input: 0–9 display; 10–15 blank.","start":366.06666666666666,"duration":40,"phraseStarts":[0.90525,3.6552499999999997,25.655249999999995,31.089457999999993],"countStart":3.6552499999999997,"invalidStart":25.655249999999995,"invalidEnd":39},{"id":"15-recap","index":14,"title":"From a requirement to working logic","chapter":"DESIGN METHOD","takeaway":"One repeatable method. Seven outputs. A complete decoder.","start":406.06666666666666,"duration":22,"phraseStarts":[0.90525,4.573249999999999,12.149166000000001]}];window.captionCues=[{"start":0.918416,"end":5.115791,"text":"In this video we'll design a digital circuit that converts a four-bit"},{"start":5.115791,"end":9.946875,"text":"BCD input into the seven signals needed to display a decimal digit."},{"start":13.401040999999998,"end":17.006332999999998,"text":"We'll start with simple logic gates simplify one output with"},{"start":17.006332999999998,"end":20.679457999999997,"text":"a Karnaugh map and then watch the complete decoder operate."},{"start":23.90525,"end":27.734208,"text":"A logic signal has two states zero and one An"},{"start":27.734208,"end":31.157373999999997,"text":"AND gate produces one only when both inputs are one."},{"start":32.285583,"end":35.537708,"text":"If either input is zero the output is zero."},{"start":36.679041,"end":39.773291,"text":"We write this as X AND Y or X dot Y"},{"start":40.047458,"end":44.667998999999995,"text":"Later AND gates will recognize particular combinations of our input bits."},{"start":47.90525,"end":53.262625,"text":"An OR gate produces one when either input is one including when both are one."},{"start":54.21816633333333,"end":57.45712433333333,"text":"Only two zero inputs produce a zero output."},{"start":58.41266666666667,"end":64.20424866666667,"text":"We write OR using a plus sign This is Boolean logic so one OR one is still one."},{"start":65.159791,"end":68.675041,"text":"OR gates will combine the different conditions that light a segment."},{"start":71.892125,"end":77.486291,"text":"A NOT gate reverses its input zero becomes one and one becomes zero."},{"start":78.302541,"end":80.528291,"text":"A bar over a variable means NOT."},{"start":81.34454099999999,"end":83.73925,"text":"Having both a signal and its inverse lets"},{"start":83.73925,"end":86.67558199999999,"text":"us recognize either value of an input bit."},{"start":89.918416,"end":95.920541,"text":"Binary-coded decimal or BCD represents one decimal digit with four bits."},{"start":96.51320833333334,"end":99.10745833333333,"text":"Their weights are eight four two"},{"start":99.15795833333334,"end":102.96270833333332,"text":"and one Zero-one-zero-one therefore represents five."},{"start":103.54224966666666,"end":108.87329166666666,"text":"Our seven outputs control segments a through g with one meaning illuminated."},{"start":109.452833,"end":113.678624,"text":"Each segment has its own Boolean function of the same four inputs."},{"start":116.90525,"end":119.681583,"text":"Let's design the top segment a It lights for"},{"start":119.681583,"end":125.525791,"text":"zero two three five six seven eight and nine."},{"start":126.774,"end":131.118208,"text":"It stays off for one and four These requirements form a truth table."},{"start":132.366416,"end":136.234833,"text":"We could build a separate detector for every illuminated case but"},{"start":136.234833,"end":140.657999,"text":"a Karnaugh map helps us combine cases and simplify the circuit."},{"start":143.90525,"end":146.94475,"text":"A Karnaugh map rearranges the truth table so"},{"start":146.94475,"end":149.4995,"text":"neighboring cells differ in just one bit."},{"start":151.657666,"end":156.672957,"text":"Notice the order zero-zero zero-one one-one one-zero."},{"start":158.831166,"end":163.62275,"text":"The rows describe the upper two input bits the columns describe the lower two."},{"start":165.780958,"end":169.664624,"text":"Every cell still represents exactly one input combination."},{"start":172.918416,"end":177.525791,"text":"We group ones into rectangles containing a power-of-two number of cells."},{"start":179.611,"end":183.67891600000002,"text":"Groups may overlap and opposite edges of the map are neighbors."},{"start":185.764125,"end":191.831999,"text":"The X cells represent inputs ten through fifteen which are not decimal BCD digits."},{"start":193.917208,"end":197.879874,"text":"We may include these don't-care cells when they help simplify the logic."},{"start":199.96504099999999,"end":203.66454099999999,"text":"Later a separate validity signal will blank those inputs."},{"start":206.918416,"end":210.433666,"text":"Within each group keep only the bits that remain constant."},{"start":213.260866,"end":219.039324,"text":"First these eight cells all have I one equal to one so their term is simply I one."},{"start":221.800733,"end":224.210691,"text":"Another group has I three equal to one."},{"start":226.972141,"end":231.09264100000001,"text":"This four-cell group keeps I two and I zero both equal to one."},{"start":233.919841,"end":238.948257,"text":"Finally the four corners wrap around the map and keep both of those bits at zero."},{"start":241.722833,"end":245.659166,"text":"OR these four terms together to obtain our simplified expression."},{"start":248.93858333333333,"end":252.00437433333335,"text":"Now translate the equation into hardware The"},{"start":252.00437433333335,"end":255.03279133333334,"text":"two single-variable terms are direct signals."},{"start":257.033666,"end":261.2595,"text":"The other two terms use AND gates with inverted inputs where needed."},{"start":263.26033266666667,"end":265.80191666666667,"text":"An OR gate combines all four terms."},{"start":267.80279133333335,"end":270.5001663333333,"text":"This structure is called a sum of products AND"},{"start":270.5001663333333,"end":273.6996663333333,"text":"operations form the products and OR combines them."},{"start":276.9385833333333,"end":280.4802083333333,"text":"We repeat the same design process for the other six segments."},{"start":282.5453743333333,"end":287.9422493333333,"text":"To keep the circuit organized we arrange it as a programmable logic array or PLA."},{"start":290.0074583333333,"end":293.7858743333333,"text":"The AND plane generates product terms from shared input rails."},{"start":295.8510833333333,"end":299.4189573333333,"text":"The OR plane selects which terms contribute to each segment."},{"start":301.4841663333333,"end":305.7099993333333,"text":"A term needed by several segments is generated once and shared."},{"start":308.9385833333333,"end":312.3859583333333,"text":"Don’t-care cells simplified the internal logic but they do"},{"start":312.3859583333333,"end":316.1907083333333,"text":"not guarantee a blank display for invalid inputs."},{"start":317.167583,"end":320.86495799999994,"text":"We add a validity signal A code is valid when the eight’s bit"},{"start":320.86495799999994,"end":324.84070699999995,"text":"is zero or when both the four’s and two’s bits are zero."},{"start":325.81762466666663,"end":328.79341566666665,"text":"Every segment output is ANDed with this signal."},{"start":329.7702913333333,"end":333.6934163333333,"text":"Inputs ten through fifteen therefore turn every segment off."},{"start":336.9719166666667,"end":340.60562366666665,"text":"Let’s follow the input zero-one-zero-one decimal five."},{"start":341.52283266666666,"end":344.7617906666667,"text":"The input rails provide each bit and its inverse."},{"start":345.67899966666664,"end":349.11320766666665,"text":"The AND plane evaluates every product term and"},{"start":349.11320766666665,"end":351.7863326666667,"text":"the OR plane combines the selected results."},{"start":352.70354166666664,"end":357.5346236666667,"text":"Outputs a c d f and g become one."},{"start":358.45183266666663,"end":363.7302496666667,"text":"The input is valid so these five segments illuminate and form the digit five."},{"start":366.9719166666667,"end":369.44770766666664,"text":"Now we can exercise the complete decoder."},{"start":369.7219166666667,"end":373.39299966666664,"text":"As the input counts from zero to nine the same fixed"},{"start":373.39299966666664,"end":377.8424576666667,"text":"logic produces each digit’s segment pattern No circuit changes are needed."},{"start":391.72191666666663,"end":396.86874966666664,"text":"When the input reaches ten VALID becomes zero and the display goes blank."},{"start":397.15612466666664,"end":400.27666566666664,"text":"The remaining invalid codes are blanked in the same way."},{"start":406.9719166666667,"end":409.94770766666664,"text":"Start by deciding when each segment must light."},{"start":410.63991666666664,"end":413.9841666666667,"text":"Write its truth table simplify it with a Karnaugh map"},{"start":414.1267916666667,"end":417.52362466666665,"text":"and implement the result with AND OR and NOT."},{"start":418.21583266666664,"end":422.15004166666665,"text":"Organize shared terms into a PLA validate every"},{"start":422.15004166666665,"end":425.7311246666667,"text":"input and the complete seven-segment decoder follows."}];const driver={t:0};const tl=gsap.timeline({paused:true});tl.to(driver,{t:428.06666666666666,duration:428.06666666666666,ease:'none',onUpdate:()=>{const cue=window.captionCues.find(c=>driver.t>=c.start&&driver.t<c.end);const el=document.getElementById('captions');const text=cue?cue.text:'';if(el.textContent!==text)el.textContent=text;el.style.opacity=cue?'1':'0';}},0);tl.fromTo('#progress',{scaleX:0},{scaleX:1,duration:428.06666666666666,ease:'none'},0);window.__timelines=window.__timelines||{};window.__timelines.main=tl;</script></body></html>
